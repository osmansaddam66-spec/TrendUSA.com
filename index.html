    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TrendUSA – Amazon Style Deals</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #eaeaea;
}

/* Amazon Header */
.header {
  background: #131921;
  color: white;
  padding: 12px;
  font-size: 22px;
  font-weight: bold;
}

/* Product Grid */
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  padding: 12px;
}

/* Product Card */
.card {
  background: white;
  padding: 10px;
  border-radius: 6px;
}

.card img {
  width: 100%;
}

.title {
  font-size: 14px;
  margin: 8px 0;
}

.price {
  color: #B12704;
  font-weight: bold;
}

.btn {
  display: block;
  margin-top: 8px;
  background: #FFD814;
  color: black;
  text-align: center;
  padding: 8px;
  text-decoration: none;
  border-radius: 6px;
  font-size: 14px;
}
</style>
</head>

<body>

<div class="header">TrendUSA</div>

<div class="products">

  <div class="card">
    <img src=https://pixabay.com/images/download/x-1868708_1920.jpg>
    <div class="title">Wireless Gaming Mouse</div>
    <div class="price">$29.99</div>
    <a class="btn" href="#">Check on Amazon</a>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300">
    <div class="title">Smart Watch Pro</div>
    <div class="price">$59.99</div>
    <a class="btn" href="#">Check on Amazon</a>
  </div>

</div>

</body>
</html>

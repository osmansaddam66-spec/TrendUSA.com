<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendUSA</title>

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  background:#f1f3f6;
}
header{
  background:#131921;
  color:#fff;
  padding:12px;
  text-align:center;
  font-size:20px;
}
.products{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap:12px;
  padding:12px;
}
.product{
  background:#fff;
  border-radius:6px;
  padding:10px;
  text-align:center;
}
.product img{
  width:100%;
  height:140px;
  object-fit:cover;
}
.title{
  font-size:14px;
  margin:6px 0;
}
.price{
  color:#B12704;
  font-weight:bold;
}
.btn{
  display:block;
  margin-top:8px;
  padding:8px;
  background:#ff9900;
  color:#000;
  text-decoration:none;
  border-radius:4px;
  font-weight:bold;
}
</style>
</head>

<body>

<header>TrendUSA</header>

<div class="products">

  <div class="product">
    <img src="https://cdn.pixabay.com/photo/2016/11/29/09/08/mouse-1868708_640.jpg">
    <div class="title">Wireless Gaming Mouse</div>
    <div class="price">৳2,499</div>
    <a class="btn" href="YOUR_DARAZ_LINK" target="_blank" rel="nofollow noopener">
      Buy on Daraz
    </a>
  </div>

  <div class="product">
    <img src="https://cdn.pixabay.com/photo/2017/01/06/19/15/technology-1959938_640.jpg">
    <div class="title">Smart Headphone</div>
    <div class="price">৳3,999</div>
    <a class="btn" href="YOUR_DARAZ_LINK" target="_blank" rel="nofollow noopener">
      Buy on Daraz
    </a>
  </div>

</div>

</body>
</html>
